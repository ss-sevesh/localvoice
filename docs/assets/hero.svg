<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Local Voice — think out loud, keep it local</title>
  <desc id="desc">A midnight desert, softly animated voice bars, and a local speech-to-speech pipeline. English, Hindi and Hinglish.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#080711"/><stop offset="1" stop-color="#352341"/></linearGradient>
    <linearGradient id="dune" x2="1" y2="1"><stop stop-color="#392c50"/><stop offset="1" stop-color="#0e0b19"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c398fa" stop-opacity=".17"/><stop offset="1" stop-color="#c398fa" stop-opacity="0"/></radialGradient>
    <style>
      text{font-family:'Segoe UI','Nirmala UI',Arial,sans-serif}
      .bar{transform-box:fill-box;transform-origin:center;animation:voice 1.6s ease-in-out infinite}
      .b2{animation-delay:-.8s}.b3{animation-delay:-.3s}.b4{animation-delay:-1.1s}.b5{animation-delay:-.5s}
      .halo{animation:breathe 5s ease-in-out infinite}
      @keyframes voice{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
      @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.bar,.halo{animation:none}}
    </style>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#sky)"/>
  <g fill="#e6d7fd" opacity=".45">
    <circle cx="46" cy="45" r="1"/><circle cx="181" cy="32" r="1.2"/><circle cx="382" cy="62" r="1"/><circle cx="533" cy="25" r="1"/><circle cx="731" cy="57" r="1.3"/><circle cx="914" cy="32" r="1"/><circle cx="1033" cy="71" r="1.2"/><circle cx="1262" cy="34" r="1"/><circle cx="1390" cy="104" r="1.4"/><circle cx="841" cy="120" r="1"/><circle cx="1370" cy="210" r="1"/><circle cx="64" cy="218" r="1"/><circle cx="667" cy="185" r="1.1"/>
  </g>
  <ellipse class="halo" cx="1125" cy="208" rx="280" ry="200" fill="url(#glow)"/>
  <path d="M0 350Q230 248 482 350T1024 330T1440 300V440H0Z" fill="#1d172c"/>
  <path d="M0 392Q290 301 630 391T1440 320V440H0Z" fill="url(#dune)"/>
  <path d="M0 420Q310 350 700 424T1440 376V440H0Z" fill="#0c0a14"/>
  <path d="M0 392Q290 301 630 391T1440 320" fill="none" stroke="#bda1df" stroke-opacity=".13"/>
  <g transform="translate(72 64)">
    <circle cx="5" cy="-5" r="4" fill="#d6baff"/>
    <text x="22" y="0" fill="#c5b5db" font-size="15" letter-spacing="3">LOCAL AI. NATURAL CONVERSATION.</text>
    <text y="119" fill="#f6f0ff" font-size="106" font-weight="650" letter-spacing="-5">local<tspan font-weight="350">voice</tspan><tspan fill="#d6baff">.</tspan></text>
    <text y="177" fill="#e2d5f5" font-size="29" font-weight="350">Think out loud. Keep it local.</text>
    <text y="233" fill="#bcaed1" font-size="18">English · हिंदी · Hinglish</text>
    <g transform="translate(0 271)">
      <rect width="224" height="35" rx="17" fill="#d6baff12" stroke="#d6baff35"/>
      <text x="18" y="23" fill="#ddc9f6" font-size="13" letter-spacing=".8">SPEECH → TEXT → VOICE</text>
      <text x="248" y="23" fill="#bcaed1" font-size="13">No hosted inference. No API keys.</text>
    </g>
  </g>
  <g transform="translate(1120 193)">
    <circle r="110" fill="none" stroke="#d6baff" stroke-opacity=".08"/>
    <circle r="89" fill="none" stroke="#d6baff" stroke-opacity=".13"/>
    <circle r="67" fill="#d6baff0b" stroke="#d6baff" stroke-opacity=".25"/>
    <g fill="#d6baff">
      <rect class="bar" x="-40" y="-15" width="8" height="30" rx="4"/>
      <rect class="bar b2" x="-22" y="-31" width="8" height="62" rx="4"/>
      <rect class="bar b3" x="-4" y="-46" width="8" height="92" rx="4"/>
      <rect class="bar b4" x="14" y="-31" width="8" height="62" rx="4"/>
      <rect class="bar b5" x="32" y="-15" width="8" height="30" rx="4"/>
    </g>
    <text y="159" text-anchor="middle" fill="#bcaed1" font-size="12" letter-spacing="3">BUILT FOR YOUR VOICE</text>
  </g>
</svg>
